name: Building and Pushing Gems

on:
  push:
    tags:
      - '*'

env:
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  CI:
    uses: enspirit/webspicy/.github/workflows/integration.yml@master

  Rubygem:
    needs: CI
    runs-on: ubuntu-latest
    steps:
      - uses: act10ns/slack@v2
        with:
          status: starting
          channel: '#opensource-cicd'

      - uses: actions/checkout@v7

      # Runs on the runner rather than inside publish-rubygems-action, whose
      # image ships a Ruby the gemspec no longer accepts. It also avoids the
      # `dubious ownership` git failures that came with that container.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Release Gem
        id: gem-push
        run: make gem.push
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}

      - uses: act10ns/slack@v2
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
          channel: '#opensource-cicd'
        if: always()
