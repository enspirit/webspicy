name: Building and Pushing images.

on:
  push:
    branches:
      - master
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Tag the images under this version instead of `latest`. Use it to
          publish the images for a release whose tag push already happened.
        required: false
        type: string

env:
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  DOCKER_BUILDKIT: 1

jobs:
  CI:
    uses: enspirit/webspicy/.github/workflows/integration.yml@master

  Images:
    needs: CI
    runs-on: ubuntu-latest
    steps:
      - uses: act10ns/slack@v2
        with:
          status: starting
          channel: '#opensource-cicd'

      - uses: actions/checkout@v7

      - name: Build images
        id: images-build
        run: make images

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # `github.ref_name` is the tag name itself. The previous
      # `git describe --contains` was only ever right for lightweight tags:
      # for an annotated one it answers `1.1.0^0`, and `docker tag` rejects
      # that as an invalid reference.
      - name: Get tag if exist
        run: echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
        if: startsWith(github.ref, 'refs/tags/')

      - name: Use the requested version
        run: echo "VERSION=${{ inputs.version }}" >> $GITHUB_ENV
        if: inputs.version != ''

      - name: Pushing images
        id: images-push
        run: make push-images

      - uses: act10ns/slack@v2
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
          channel: '#opensource-cicd'
        if: always()
